# Opens the DPTH health check every 10 minutes so the free Render instance does not fall asleep.
# Contains no secrets: the site address is public anyway.
name: Keep DPTH awake

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: {}

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Ping health check
        run: curl -fsS --max-time 120 --retry 2 --retry-delay 10 https://payment-platform-h303.onrender.com/api/health
